name: Automation Request
run-name: Automation request for PR ${{ inputs.pr_number }} by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number: review, fix within limits, and merge when enabled and all checks pass'
        required: true
        type: string
permissions: {}
jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.0'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate requester and bind current PR commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.automation_requests --output "$RUNNER_TEMP/request/request.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-request
          path: ${{ runner.temp }}/request/request.json
          retention-days: 7
          if-no-files-found: error
