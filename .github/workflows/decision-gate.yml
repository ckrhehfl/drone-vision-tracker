name: Decision Gate
run-name: Decision PR ${{ inputs.pr_number }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      request_id:
        required: true
        type: string
      gate_bundle:
        required: true
        type: string
permissions: {}
concurrency:
  group: decision-gate-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.0'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate full JSON and current CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.gate_publication validate --directory "$RUNNER_TEMP/validated"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-decision
          path: ${{ runner.temp }}/validated/*.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.0'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-decision
          path: ${{ runner.temp }}/validated
      - name: Revalidate and publish only the commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.gate_publication publish --directory "$RUNNER_TEMP/validated"
