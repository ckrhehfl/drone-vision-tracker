name: Codex Review
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
env:
  CI_RUN_ID: ${{ github.event.workflow_run.id }}
jobs:
  plan:
    # No API invocation before cost approval + secret + explicit activation.
    if: >-
      vars.CODEX_REVIEW_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - name: Require secret and explicitly approved model
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL }}
        run: |
          test -n "$API_KEY" || { echo 'HUMAN_ACTION_REQUIRED: register OPENAI_API_KEY'; exit 1; }
          test -n "$REVIEW_MODEL" || { echo 'HUMAN_DECISION_REQUIRED: approve API model and budget'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.0'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require activation in trusted base
        run: |
          python -c "import json; c=json.load(open('config/automation.json')); assert c['external_review_enabled'] is True, 'Review not activated in trusted base'"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.review_context prepare --directory "$RUNNER_TEMP/review"

  review:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.0'
      - run: python -m pip install -r requirements-dev.txt
      - name: Recheck live PR and prepare a fresh independent scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
          HEAD: ${{ needs.plan.outputs.head }}
          SCOPE: ${{ matrix.scope }}
        run: >-
          python -m tools.review_context prepare --directory "$RUNNER_TEMP/review"
          --scope "$SCOPE" --base "$BASE" --head "$HEAD"
      - name: Independent read-only Codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.130.0'
          model: ${{ vars.CODEX_REVIEW_MODEL }}
          effort: medium
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: false
          prompt-file: ${{ runner.temp }}/review/prompt.txt
          output-schema-file: schemas/review.schema.json
          output-file: ${{ runner.temp }}/review/${{ matrix.scope }}.json
          codex-args: '["--ephemeral"]'
      - name: Check repository immutability and current SHA
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.review_context verify --directory "$RUNNER_TEMP/review"
      - name: Validate structured result
        env:
          BASE: ${{ needs.plan.outputs.base }}
          HEAD: ${{ needs.plan.outputs.head }}
          SCOPE: ${{ matrix.scope }}
        run: >-
          python -m tools.review validate --base "$BASE" --head "$HEAD" --scope "$SCOPE"
          --report "$RUNNER_TEMP/review/$SCOPE.json" --output "$RUNNER_TEMP/validated/$SCOPE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: review-${{ matrix.scope }}
          path: ${{ runner.temp }}/validated/${{ matrix.scope }}.json
          if-no-files-found: error
          retention-days: 7

  result:
    needs: [plan, review]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.0'
      - run: python -m pip install -r requirements-dev.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
          HEAD: ${{ needs.plan.outputs.head }}
        run: >-
          python -m tools.review_context prepare --directory "$RUNNER_TEMP/review"
          --base "$BASE" --head "$HEAD"
      # Downloads only artifacts of this workflow run, never PR-produced CI artifacts.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: review-scope-*
          path: ${{ runner.temp }}/reports
          merge-multiple: true
      - name: Structured PASS or failure
        env:
          BASE: ${{ needs.plan.outputs.base }}
          HEAD: ${{ needs.plan.outputs.head }}
        run: >-
          python -m tools.review merge --base "$BASE" --head "$HEAD"
          --reports-dir "$RUNNER_TEMP/reports" --output "$RUNNER_TEMP/review-result.json"
      - name: Display all findings
        if: always()
        run: python -m tools.review_summary "$RUNNER_TEMP/review-result.json"
      - name: Refuse stale result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.review_context verify --directory "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: structured-review-result
          path: ${{ runner.temp }}/review-result.json
          if-no-files-found: error
          retention-days: 7
